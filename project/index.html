<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Access</title>
<style>
  :root { --bg:#0e0f13; --surface:#16181f; --surface2:#1e2029; --text:#e8e9ee; --muted:#7c8096; --accent:#5b8dee; --border:#2a2d38; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;background:radial-gradient(circle at top,#2a2f4d 0%,#0e0f13 45%);color:var(--text);font-family:Segoe UI,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;}
  a{color:inherit;text-decoration:none;}
  .page{width:min(100%,720px);background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;}
  .panel{padding:36px;}
  .panel h1{font-size:2rem;margin-bottom:12px;color:var(--text);}
  .panel p{color:var(--muted);line-height:1.8;margin-bottom:20px;}
  .form-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .form-row input{flex:1 1 220px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px 16px;font-size:15px;}
  .form-row button{border:none;border-radius:12px;padding:14px 20px;font-size:15px;cursor:pointer;color:#fff;background:var(--accent);transition:.2s;background:linear-gradient(135deg,#5b8dee,#a78bfa);}
  .form-row button:hover{filter:brightness(1.05);}
  .note{font-size:13px;color:var(--muted);margin-top:8px;}
  .success{display:none;animation:fadeIn .25s ease both;}
  .success.active{display:block;}
  .success p{margin-bottom:18px;}
  .success a{display:inline-flex;align-items:center;gap:10px;padding:14px 18px;border-radius:14px;background:rgba(91,141,238,.12);border:1px solid rgba(91,141,238,.18);color:var(--accent);font-weight:600;}
  .status{color:#f59e0b;margin-top:10px;}
  .back-link{display:inline-block;color:var(--muted);font-size:14px;}
  .lang-switcher{display:flex;gap:10px;align-items:center;}
  .lang-btn{border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Mono',monospace;padding:8px 14px;border-radius:999px;cursor:pointer;transition:all .2s;}
  .lang-btn.active, .lang-btn:hover{border-color:rgba(91,141,238,.5);color:var(--text);background:rgba(91,141,238,.14);}
  .warning{margin-top:24px;padding:16px;border-radius:16px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.16);color:var(--muted);font-size:13px;line-height:1.7;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:20px;">
        <a href="../index.html" class="back-link" data-i18n="back.link">← Back to homepage</a>
        <div class="lang-switcher">
          <button type="button" class="lang-btn active" data-lang="hu">HU</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <h1 data-i18n="page.header">Project Access</h1>
      <p data-i18n="intro.text">Enter the password you received to unlock your dedicated customer preview page.</p>
      <form id="access-form">
        <div class="form-row">
          <input id="password-input" type="password" placeholder="Enter password" aria-label="Password" autocomplete="current-password" data-i18n="form.passwordPlaceholder" required>
          <button type="submit" data-i18n="form.submit">Unlock</button>
        </div>
      </form>
      <div id="status-message" class="status"></div>
      <div id="unlock-success" class="success" aria-live="polite">
        <p data-i18n="success.message">Access granted. Your project content is ready.</p>
        <a id="project-link" href="AlphaInvestMedia_redesign/" data-i18n="success.open">Open AlphaInvestMedia redesign</a>
      </div>
    </div>
  </div>
  <script src="access-config.js"></script>
<script>
const accounts = window.PROJECT_ACCESS || {};
const accessKey = 'projectAccessHash';
const form = document.getElementById('access-form');
const input = document.getElementById('password-input');
const status = document.getElementById('status-message');
const success = document.getElementById('unlock-success');
const link = document.getElementById('project-link');
const translations = {
  en: {
    'page.header': 'Project Access',
    'back.link': '← Back to homepage',
    'intro.text': 'Enter the password you received to unlock your dedicated customer preview page.',
    'form.passwordPlaceholder': 'Enter password',
    'form.submit': 'Unlock',
    'status.validating': 'Validating...',
    'status.error': 'Incorrect password. Please try again.',
    'success.message': 'Access granted. Your project content is ready.',
    'success.open': 'Open AlphaInvestMedia redesign'
  },
  hu: {
    'page.header': 'Projekt hozzáférés',
    'back.link': '← Vissza a kezdőlapra',
    'intro.text': 'Add meg a jelszót a neked szánt ügyfél-áttekintés feloldásához.',
    'form.passwordPlaceholder': 'Add meg a jelszót',
    'form.submit': 'Feloldás',
    'status.validating': 'Ellenőrzés...',
    'status.error': 'Helytelen jelszó. Kérlek próbáld újra.',
    'success.message': 'Hozzáférés megadva. A projekt tartalma elérhető.',
    'success.open': 'AlphaInvestMedia redesign megnyitása'
  }
};
function hexEncode(buffer){ return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2,'0')).join(''); }
async function hashPassword(password){ const data = new TextEncoder().encode(password); const hashBuffer = await crypto.subtle.digest('SHA-256', data); return hexEncode(hashBuffer); }
function translate(lang){
  document.documentElement.lang = lang;
  document.title = translations[lang]['page.header'] || document.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (!key || !translations[lang] || translations[lang][key] === undefined) return;
    if (el.tagName === 'INPUT') {
      el.placeholder = translations[lang][key];
    } else {
      el.innerHTML = translations[lang][key];
    }
  });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
}
function showSuccess(account){ status.textContent = ''; success.classList.add('active'); link.href = account.href; link.textContent = account.title; }
function showError(message){ status.textContent = message; success.classList.remove('active'); }
async function unlock(password){ const hash = await hashPassword(password.trim()); const account = accounts[hash]; if(account){ localStorage.setItem(accessKey, hash); showSuccess(account); return true; } showError(translations[currentLang]['status.error']); return false; }
form.addEventListener('submit', async event => { event.preventDefault(); showError(translations[currentLang]['status.validating']); const valid = await unlock(input.value); if(valid) input.value = ''; });
let currentLang = localStorage.getItem('preferredLang') || 'hu';
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('preferredLang', currentLang);
    translate(currentLang);
  });
});
(async () => {
  translate(currentLang);
  const saved = localStorage.getItem(accessKey);
  if(saved && accounts[saved]) showSuccess(accounts[saved]);
})();
</script>
</body>
</html>
